<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantasy Manager v10</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --surface: #13161e;
  --surface2: #1a1d27;
  --border: rgba(255,255,255,0.08);
  --accent: #00e5a0;
  --accent2: #ff5c5c;
  --accent3: #ffb347;
  --accent4: #5c9eff;
  --purple: #a07cff;
  --text: #ffffff;
  --text2: #c8cdd8;
  --text3: #8b91a8;
  --radius: 12px;
  --radius-sm: 8px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  overflow-x: hidden;
}
/* ── LAYOUT ── */
#root { display: flex; flex-direction: column; min-height: 100vh; }
.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.app-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 2px;
  color: var(--accent);
}
.app-version { font-size: 10px; color: var(--text3); margin-left: 6px; }
.app-body { display: flex; flex: 1; }
.sidebar {
  width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 12px;
  overflow-y: auto;
  flex-shrink: 0;
  height: calc(100vh - 53px);
  position: sticky;
  top: 53px;
}
.main-content {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  min-width: 0;
}
/* ── CONFIG PANEL ── */
.config-panel {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.config-field { display: flex; flex-direction: column; gap: 3px; }
.config-field label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); }
.config-field input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 6px 10px;
  font-size: 13px;
  font-family: 'Inter', sans-serif;
  width: 140px;
}
.config-field input:focus { outline: none; border-color: var(--accent4); }
.config-field input.short { width: 70px; }
/* ── SECTION LABELS ── */
.section-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 2px;
  color: var(--text3);
  padding: 14px 4px 6px;
  text-transform: uppercase;
}
/* ── BUTTONS ── */
.btn {
  display: block;
  width: 100%;
  padding: 9px 12px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: opacity 0.15s, transform 0.1s;
  margin-bottom: 4px;
}
.btn:hover { opacity: 0.85; }
.btn:active { transform: scale(0.98); }
.btn-green { background: rgba(0,229,160,0.15); color: var(--accent); border: 1px solid rgba(0,229,160,0.3); }
.btn-blue { background: rgba(92,158,255,0.15); color: var(--accent4); border: 1px solid rgba(92,158,255,0.3); }
.btn-red { background: rgba(255,92,92,0.15); color: var(--accent2); border: 1px solid rgba(255,92,92,0.3); }
.btn-orange { background: rgba(255,179,71,0.15); color: var(--accent3); border: 1px solid rgba(255,179,71,0.3); }
.btn-purple { background: rgba(160,124,255,0.15); color: var(--purple); border: 1px solid rgba(160,124,255,0.3); }
.btn-active { ring: 2px solid var(--accent); }
/* ── CARDS ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.card-title { font-size: 15px; font-weight: 700; }
.card-subtitle { font-size: 12px; color: var(--text2); margin-top: 2px; }
/* ── TAGS ── */
.tag {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
}
.tag-green { background: rgba(0,229,160,0.15); color: var(--accent); }
.tag-red { background: rgba(255,92,92,0.15); color: var(--accent2); }
.tag-orange { background: rgba(255,179,71,0.15); color: var(--accent3); }
.tag-blue { background: rgba(92,158,255,0.15); color: var(--accent4); }
.tag-gray { background: rgba(255,255,255,0.08); color: var(--text3); }
/* ── POS BADGES ── */
.pos {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 20px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 800;
  flex-shrink: 0;
}
.pos-QB { background: #1a3a6b; color: #5c9eff; }
.pos-RB { background: #0d3326; color: #00e5a0; }
.pos-WR { background: #2a1a4a; color: #a07cff; }
.pos-TE { background: #3a2a0a; color: #ffb347; }
.pos-K  { background: #3a0a0a; color: #ff5c5c; }
.pos-DEF{ background: #1a1a3a; color: #8b91a8; }
/* ── STAT TILES ── */
.stat-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-tile {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  flex: 1;
  min-width: 80px;
  text-align: center;
}
.stat-tile .val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.8rem;
  line-height: 1;
}
.stat-tile .lbl { font-size: 10px; color: var(--text3); margin-top: 3px; text-transform: uppercase; letter-spacing: 1px; }
/* ── BAR ── */
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.bar-label { font-size: 10px; color: var(--text3); width: 44px; flex-shrink: 0; }
.bar-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
.bar-score { font-size: 10px; font-weight: 700; width: 14px; text-align: right; }
/* ── PLAYER ROW ── */
.player-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 3px;
}
.player-name { font-size: 12px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player-team { font-size: 10px; color: var(--text3); }
.player-pts { font-size: 12px; font-weight: 700; }
/* ── ALERTS ── */
.alert {
  padding: 14px 16px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  border-left: 4px solid;
}
.alert-success { background: rgba(0,229,160,0.08); border-color: var(--accent); }
.alert-error { background: rgba(255,92,92,0.08); border-color: var(--accent2); }
.alert-info { background: rgba(92,158,255,0.08); border-color: var(--accent4); }
.alert h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.alert p { font-size: 13px; color: var(--text2); }
/* ── LOADING ── */
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  color: var(--text3);
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-msg { font-size: 13px; color: var(--text3); }
/* ── GRID ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
/* ── SWAP CARD ── */
.swap-card {
  display: grid;
  grid-template-columns: 1fr 28px 1fr;
  gap: 8px;
  align-items: center;
  padding: 10px;
  background: rgba(255,179,71,0.05);
  border: 1px solid rgba(255,179,71,0.25);
  border-radius: var(--radius-sm);
  margin-bottom: 5px;
}
/* ── ACCORDION NAV ── */
.accordion { border-bottom: 1px solid var(--border); }
.accordion-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
  user-select: none;
  background: var(--surface);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text3);
  border: none;
  width: 100%;
  text-align: left;
}
.accordion-header:active { background: var(--surface2); }
.accordion-chevron { font-size: 10px; transition: transform 0.2s; }
.accordion-chevron.open { transform: rotate(180deg); }
.accordion-body { background: var(--bg); }
.accordion-btn {
  display: block;
  width: 100%;
  padding: 11px 20px;
  border: none;
  border-bottom: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
}
.accordion-btn:active { background: var(--surface2); }
.accordion-btn.active { color: var(--accent); background: rgba(0,229,160,0.06); border-left: 3px solid var(--accent); }

/* ── MOBILE ── */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .mobile-accordion { display: block; border-top: 1px solid var(--border); }
  .main-content { padding: 12px; }
  .config-panel { flex-direction: column; align-items: flex-start; }
  .config-field input, .config-field input.short { width: 100%; }
  .grid-2 { grid-template-columns: 1fr; }
}
@media (min-width: 769px) {
  .mobile-accordion { display: none; }
}
/* ── RADAR SVG ── */
.radar-wrap { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 12px; }
.radar-wrap svg { flex-shrink: 0; }
/* ── EMPTY ── */
.empty { padding: 40px 20px; text-align: center; color: var(--text3); font-size: 14px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useCallback, useRef } = React;
const e = React.createElement;

// ── API ───────────────────────────────────────────────────────────────────────
const API = {
  post: async (path, body) => {
    const r = await fetch(`/api${path}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) { let d = ''; try { d = (await r.json()).detail || ''; } catch (_) {} throw new Error(d || `API error: ${r.status}`); }
    return r.json();
  },
};

// ── HELPERS ───────────────────────────────────────────────────────────────────
const POS_CLASS = pos => ({ QB:'pos-QB', RB:'pos-RB', WR:'pos-WR', TE:'pos-TE', K:'pos-K', DEF:'pos-DEF' }[pos] || '');
const POS_COLORS = { QB:'var(--accent4)', RB:'var(--accent)', WR:'var(--purple)', TE:'var(--accent3)', K:'var(--accent2)', DEF:'var(--text3)' };

function PosBadge({ pos }) {
  return e('span', { className: `pos ${POS_CLASS(pos)}` }, pos);
}

function Tag({ color, children }) {
  return e('span', { className: `tag tag-${color}` }, children);
}

function Card({ children, style, borderColor }) {
  return e('div', {
    className: 'card',
    style: { ...(borderColor ? { borderLeft: `3px solid ${borderColor}` } : {}), ...style }
  }, children);
}

function StatTile({ value, label, color }) {
  return e('div', { className: 'stat-tile' },
    e('div', { className: 'val', style: { color: color || 'var(--text)' } }, value),
    e('div', { className: 'lbl' }, label)
  );
}

function BarRow({ label, score, color, maxScore = 5 }) {
  return e('div', { className: 'bar-row' },
    e('span', { className: 'bar-label' }, label),
    e('div', { className: 'bar-track' },
      e('div', { className: 'bar-fill', style: { width: `${(score / maxScore) * 100}%`, background: color } })
    ),
    e('span', { className: 'bar-score', style: { color } }, score)
  );
}

function PlayerRow({ player, showYtd }) {
  const ptColor = player.pts >= 20 ? 'var(--accent)' : player.pts >= 10 ? 'var(--text2)' : 'var(--accent2)';
  return e('div', { className: 'player-row' },
    e(PosBadge, { pos: player.position }),
    e('span', { className: 'player-name' }, player.name),
    e('span', { className: 'player-team' }, player.team),
    player.injury_status && e(Tag, { color: 'red' }, player.injury_status.toUpperCase()),
    e('span', { className: 'player-pts', style: { color: ptColor } },
      showYtd && player.ytd_avg ? `${player.pts}/${player.ytd_avg}` : player.pts
    )
  );
}

function Loading({ message }) {
  return e('div', { className: 'loading' },
    e('div', { className: 'spinner' }),
    e('div', { className: 'loading-msg' }, message || 'Loading…')
  );
}

function Alert({ type, title, children }) {
  return e('div', { className: `alert alert-${type || 'info'}` },
    title && e('h3', null, title),
    children
  );
}

// ── RESULTS VIEWS ─────────────────────────────────────────────────────────────

function AlertsView({ data, type }) {
  if (!data || !data.results?.length) return e(Alert, { type: 'success', title: '✅ All Clear' }, e('p', null, 'No issues found across your leagues.'));
  return e('div', null,
    data.results.map(r => e(Card, { key: r.league, borderColor: 'var(--accent2)' },
      e('div', { className: 'card-header' },
        e('div', null, e('div', { className: 'card-title' }, r.league), r.team && e('div', { className: 'card-subtitle' }, r.team)),
        e(Tag, { color: 'red' }, `${(r.injured || r.questionable || r.on_bye || r.zero_starters || []).length} flagged`)
      ),
      (r.injured || r.questionable || r.on_bye || r.zero_starters || []).map(p =>
        e('div', { key: p.id, className: 'player-row' },
          p.slot && e('span', { style: { fontSize: 9, color: 'var(--text3)', minWidth: 52, textAlign: 'center' } }, p.slot),
          e(PosBadge, { pos: p.position }),
          e('span', { className: 'player-name' }, p.name),
          e('span', { className: 'player-team' }, p.team),
          e(Tag, { color: 'red' }, (p.status || '').toUpperCase())
        )
      )
    ))
  );
}

// ── IR-ELIGIBLE VIEW ──────────────────────────────────────────────────────────
function IrEligibleView({ data }) {
  if (!data) return null;
  const sm = data.summary || {};
  const withElig = (data.results || []).filter(r => r.eligible?.length);
  const onlyNot = (data.results || []).filter(r => !r.eligible?.length && r.not_eligible?.length);
  const row = (p, color) => e('div', { key: p.id, className: 'player-row' },
    e('span', { style: { fontSize: 9, color: p.role === 'starter' ? 'var(--accent3)' : 'var(--text3)', minWidth: 46, textAlign: 'center', fontWeight: p.role === 'starter' ? 700 : 400 } }, p.role.toUpperCase()),
    e(PosBadge, { pos: p.position }),
    e('span', { className: 'player-name' }, p.name, p.injury ? e('span', { style: { fontSize: 10, color: 'var(--text3)' } }, ` · ${p.injury}`) : null),
    e('span', { className: 'player-team' }, p.team),
    e(Tag, { color }, p.status));
  if (!withElig.length && !onlyNot.length) return e(Alert, { type: 'success', title: '✅ All Clear' }, e('p', null, 'No IR-eligible players sitting outside the IR slot.'));
  return e('div', null,
    e('div', { className: 'stat-row' },
      e(StatTile, { value: sm.eligible_players ?? 0, label: 'IR-Eligible, Not On IR', color: 'var(--accent2)' }),
      e(StatTile, { value: sm.can_move_now ?? 0, label: 'Can Move Now', color: 'var(--accent)' }),
      e(StatTile, { value: sm.ir_full ?? 0, label: 'IR Full', color: 'var(--accent3)' }),
      e(StatTile, { value: sm.no_ir_slot ?? 0, label: 'No IR Slot', color: 'var(--text3)' })
    ),
    withElig.map(r => e(Card, { key: r.league, borderColor: r.ir_open > 0 ? 'var(--accent)' : 'var(--accent2)' },
      e('div', { className: 'card-header' },
        e('div', null, e('div', { className: 'card-title' }, r.league), r.team && e('div', { className: 'card-subtitle' }, r.team)),
        e('div', { style: { textAlign: 'right' } },
          e('div', { style: { fontSize: 12, fontWeight: 800, color: r.ir_open > 0 ? 'var(--accent)' : 'var(--accent2)' } }, `IR ${r.ir_used}/${r.ir_slots}`),
          e('div', { style: { fontSize: 10, color: 'var(--text3)' } }, `allows ${r.allowed_statuses.join(', ')}`))
      ),
      e('div', { style: { fontSize: 11, color: 'var(--text2)', marginBottom: 8, fontWeight: 700 } }, r.action),
      r.eligible.map(p => row(p, 'red')),
      r.not_eligible?.length > 0 && e('details', { style: { marginTop: 6 } },
        e('summary', { style: { fontSize: 10, color: 'var(--text3)', cursor: 'pointer' } }, `${r.not_eligible.length} out but not IR-eligible here`),
        r.not_eligible.map(p => row(p, 'yellow')))
    )),
    onlyNot.length > 0 && e(Card, { borderColor: 'var(--text3)' },
      e('div', { style: { fontSize: 11, textTransform: 'uppercase', letterSpacing: 1, color: 'var(--text3)', marginBottom: 6 } }, `Out but not IR-eligible (${onlyNot.length} leagues) — hold or drop`),
      onlyNot.map(r => e('div', { key: r.league, style: { fontSize: 11, padding: '4px 0', borderBottom: '1px solid var(--border)' } },
        e('b', null, r.league), e('span', { style: { color: 'var(--text3)' } }, ` · ${r.not_eligible.map(p => `${p.name} (${p.status}${p.role === 'starter' ? ', starting!' : ''})`).join(', ')}`)))
    ),
    data.note && e('div', { style: { fontSize: 10, color: 'var(--text3)', marginTop: 8 } }, data.note)
  );
}

function WeekRecordView({ data }) {
  if (!data?.results?.length) return e(Alert, { type: 'info' }, e('p', null, 'No matchup data found.'));
  const wins = data.results.filter(r => r.proj_win).length;
  const losses = data.results.filter(r => !r.proj_win).length;
  const actualWins = data.week_completed ? data.results.filter(r => r.actual_won && !r.actual_tied).length : null;
  const actualLosses = data.week_completed ? data.results.filter(r => !r.actual_won && !r.actual_tied).length : null;

  return e('div', null,
    e('div', { className: 'stat-row' },
      e(StatTile, { value: `${wins}-${losses}`, label: 'Projected', color: 'var(--accent4)' }),
      data.week_completed
        ? e(StatTile, { value: `${actualWins}-${actualLosses}`, label: 'Actual', color: 'var(--accent)' })
        : e(StatTile, { value: '?-?', label: 'Actual', color: 'var(--text3)' }),
      e(StatTile, { value: data.results.filter(r => r.surprise).length, label: 'Surprises', color: 'var(--accent3)' })
    ),
    data.results.filter(r => r.surprise).length > 0 && e(Card, { borderColor: 'var(--accent3)' },
      e('div', { style: { fontFamily: 'Bebas Neue', letterSpacing: 2, color: 'var(--accent3)', marginBottom: 10 } }, '⚡ SURPRISES'),
      data.results.filter(r => r.surprise).map(r =>
        e('div', { key: r.league, style: { display: 'flex', justifyContent: 'space-between', padding: '7px 0', borderBottom: '1px solid var(--border)' } },
          e('div', null, e('div', { style: { fontWeight: 700, fontSize: 13 } }, r.league), e('div', { style: { fontSize: 11, color: 'var(--text2)' } }, `${r.team ? r.team + ' · ' : ''}vs ${r.opp_name}`)),
          e('div', { style: { textAlign: 'right' } },
            e('div', { style: { fontWeight: 700, fontSize: 11, color: r.surprise === 'upset_win' ? 'var(--accent)' : 'var(--accent2)' } }, r.surprise === 'upset_win' ? '🎉 Upset Win' : '😤 Upset Loss'),
            e('div', { style: { fontSize: 10, color: 'var(--text3)' } }, `${r.my_actual?.toFixed(2)} – ${r.opp_actual?.toFixed(2)}`)
          )
        )
      )
    ),
    e('div', { style: { fontFamily: 'Bebas Neue', letterSpacing: 2, color: 'var(--text2)', marginBottom: 10 } }, 'BY LEAGUE'),
    data.results.map(r => {
      const projColor = r.proj_win ? 'var(--accent)' : 'var(--accent2)';
      return e('div', { key: r.league, style: { display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', background: 'var(--surface)', border: '1px solid var(--border)', borderLeft: `3px solid ${projColor}`, borderRadius: 8, marginBottom: 6, flexWrap: 'wrap' } },

// Renders explicit swap pairs from the backend. `ptsKey` picks which number to show.
function MovesList({ moves, ptsKey = 'pts', subKey, title = '🔄 Moves To Make', verb }) {
  if (!moves?.length) return null;
  const v = verb || { start: 'START', move: 'MOVE', bench: 'BENCH' };
  const STYLE = {
    start: { bg: 'rgba(0,229,160,0.06)',  border: 'rgba(0,229,160,0.3)',  color: 'var(--accent)',  icon: '▲' },
    move:  { bg: 'rgba(92,158,255,0.06)', border: 'rgba(92,158,255,0.3)', color: 'var(--accent4)', icon: '↔' },
    bench: { bg: 'rgba(255,92,92,0.06)',  border: 'rgba(255,92,92,0.3)',  color: 'var(--accent2)', icon: '▼' },
  };
  const pts = p => `${p[ptsKey] ?? p.pts ?? ''}${subKey && p[subKey] != null ? (p.gp > 0 ? ` · ${p[subKey]}${p.std != null ? ` ±${p.std}` : ''} avg (${p.gp} GP)` : ' · 0 GP') : ''}${subKey && p.blended != null && p.gp > 0 ? ` → ${p.blended} floor` : ''}`;
  return e('div', { style: { marginBottom: 12 } },
    e('div', { style: { fontSize: 10, textTransform: 'uppercase', letterSpacing: 1, color: 'var(--accent3)', marginBottom: 6 } }, title),
    moves.map((m, i) => {
      const st = STYLE[m.type] || STYLE.move;
      const p = m.player;
      const where = m.type === 'start' ? `→ ${m.to_slot}` : m.type === 'move' ? `${m.from_slot} → ${m.to_slot}` : `from ${m.from_slot}`;
      return e('div', { key: i, style: { display: 'flex', alignItems: 'center', gap: 8, padding: '8px 10px', background: st.bg, border: `1px solid ${st.border}`, borderRadius: 8, marginBottom: 4 } },
        e('span', { style: { fontSize: 10, fontWeight: 800, color: st.color, minWidth: 54 } }, `${st.icon} ${v[m.type]}`),
        e(PosBadge, { pos: p.position }),
        e('div', { style: { flex: 1, minWidth: 0 } },
          e('div', { style: { fontSize: 12, fontWeight: 700, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, p.name),
          e('div', { style: { fontSize: 10, color: 'var(--text3)' } }, `${p.team} · ${where}`)
        ),
        e('span', { style: { fontSize: 12, fontWeight: 700, color: st.color } }, pts(p))
      );
    })
  );
}

                e(Tag, { color: 'gray' }, `avg age ${r.avg_age}`)
              )
            )
          );
        })
      );
    })

}

          e('span', { style: { fontFamily: 'Bebas Neue', color: v.status_color, flexShrink: 0 } }, i + 1), a))
      )
    ),

    // ── tiles ──
    e('div', { className: 'stat-row' },
      e(StatTile, { value: pct(data.win_pct), label: 'Win %', color: data.win_pct >= 0.5 ? 'var(--accent)' : 'var(--accent2)' }),
      e(StatTile, { value: v.luck == null ? '—' : `${v.luck > 0 ? '+' : ''}${v.luck}`, label: `Luck (exp ${v.exp_wins ?? '—'} W)`, color: v.luck == null ? 'var(--text3)' : v.luck <= -1 ? 'var(--accent3)' : v.luck >= 1 ? 'var(--accent4)' : 'var(--text2)' }),
      e(StatTile, { value: data.proj_final, label: 'Proj Final', color: 'var(--accent4)' }),
      e(StatTile, { value: data.total_left_on_bench, label: 'Pts On Bench (season)', color: data.total_left_on_bench >= 20 ? 'var(--accent3)' : 'var(--text2)' })
    ),

    // ── score bars ──
    e(Card, null,
      [['Roster', 'var(--accent4)'], ['Draft', 'var(--purple)'], ['Age', 'var(--accent3)'], ['Depth', 'var(--accent)'], ['Record', '#00e5a0']]
        .map(([k, c]) => e(BarRow, { key: k, label: k, score: data.scores?.[k] ?? 0, color: c })),
      e('div', { style: { fontSize: 10, color: 'var(--text3)', marginTop: 6 } }, `roster score ${data.roster_composite}/5 · with record ${data.composite}/5`)
    ),

    // ── position groups ──
    e(Section, { title: 'POSITION GROUPS', right: 'starter avg vs league starter avg' },
      e('div', { className: 'grid-2' },
        data.position_groups.map(g => {
          const gc = GRADE_COLOR[g.grade] || 'var(--text3)';
          const open = openPos.has(g.position);
          return e('div', { key: g.position, style: { background: 'var(--surface)', border: '1px solid var(--border)', borderLeft: `3px solid ${gc}`, borderRadius: 10, overflow: 'hidden' } },
            e('button', { onClick: () => togglePos(g.position), style: { width: '100%', background: 'transparent', border: 'none', cursor: 'pointer', textAlign: 'left', padding: '10px 12px', display: 'flex', alignItems: 'center', gap: 10 } },
              e('div', { style: { fontFamily: 'Bebas Neue', fontSize: '2rem', lineHeight: 1, color: gc, minWidth: 30 } }, g.grade),
              e('div', { style: { flex: 1 } },
                e('div', { style: { display: 'flex', alignItems: 'center', gap: 6 } }, e(PosBadge, { pos: g.position }),
                  e('span', { style: { fontSize: 12, fontWeight: 700, color: 'var(--text)' } }, `${g.my_avg} vs ${g.league_avg}`),
                  g.need && e(Tag, { color: 'red' }, 'NEED'), g.surplus && e(Tag, { color: 'blue' }, 'SURPLUS')),
                e('div', { style: { fontSize: 10, color: 'var(--text3)', marginTop: 2 } }, `${g.count} rostered · ${g.starters} starting (${g.dedicated_slots} slot${g.dedicated_slots !== 1 ? 's' : ''}${g.flex_slots ? ` + ${g.flex_slots} flex` : ''}) · ${g.starter_quality} starter-quality`)
              ),
              e('span', { style: { fontSize: 10, color: 'var(--text3)' } }, open ? '▲' : '▼')
            ),
            open && e('div', { style: { padding: '0 8px 8px' } }, g.players.map(p => e(PlayerLine, { key: p.id, p })))
          );
        })
      )
    ),

    // ── this week's lineup ──
    e(Section, { title: `WEEK ${data.week} LINEUP`, right: `current ${data.lineup.current_pts} → optimal ${data.lineup.optimal_pts}` },
      data.lineup.zero_starters?.length > 0 && e(Alert, { type: 'error' }, e('p', null, `0-point starters: ${data.lineup.zero_starters.map(p => p.name).join(', ')}`)),
      data.lineup.injured_starters?.length > 0 && e(Alert, { type: 'error' }, e('p', null, `Injured starters: ${data.lineup.injured_starters.map(p => `${p.name} (${(p.injury_status || '').toUpperCase()})`).join(', ')}`)),
      data.lineup.moves?.length ? e(MovesList, { moves: data.lineup.moves, ptsKey: 'pts' }) : e('div', { style: { fontSize: 12, color: 'var(--accent)', marginBottom: 8 } }, '✅ Lineup is optimal.'),
      data.lineup.slots.map((sl, i) => sl.player
        ? e('div', { key: i, className: 'player-row', style: { opacity: sl.locked ? 0.6 : 1 } },
            e('span', { style: { fontSize: 9, color: 'var(--text3)', minWidth: 52, textAlign: 'center' } }, sl.locked ? `🔒 ${sl.slot}` : sl.slot),
            e(PosBadge, { pos: sl.player.position }), e('span', { className: 'player-name' }, sl.player.name), e('span', { className: 'player-team' }, sl.player.team),
            e('span', { className: 'player-pts', style: { color: sl.player.pts >= 15 ? 'var(--accent)' : 'var(--text2)' } }, sl.player.pts))
        : e('div', { key: i, className: 'player-row', style: { opacity: 0.5 } }, e('span', { style: { fontSize: 9, color: 'var(--text3)', minWidth: 52, textAlign: 'center' } }, sl.slot), e('span', { style: { fontSize: 11, color: 'var(--accent2)' } }, 'Empty'))
      )
    ),

    // ── season log ──
    e(Section, { title: 'SEASON LOG', right: data.season_log.length ? `avg efficiency ${data.avg_efficiency}% · ${data.games_cost_by_lineup} game${data.games_cost_by_lineup !== 1 ? 's' : ''} lost to lineup` : 'no completed weeks' },
      data.season_log.map(w => {
        const c = w.won ? 'var(--accent)' : w.won === false ? 'var(--accent2)' : 'var(--accent3)';
        const ec = w.efficiency >= 95 ? 'var(--accent)' : w.efficiency >= 85 ? 'var(--accent3)' : 'var(--accent2)';
        return e('div', { key: w.week, style: { display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', background: 'var(--surface)', border: '1px solid var(--border)', borderLeft: `3px solid ${c}`, borderRadius: 8, marginBottom: 4 } },
          e('div', { style: { minWidth: 34, fontSize: 10, color: 'var(--text3)' } }, `Wk ${w.week}`),
          e('div', { style: { minWidth: 26, fontWeight: 800, color: c, fontSize: 13 } }, w.won ? 'W' : w.won === false ? 'L' : 'T'),
          e('div', { style: { flex: 1, minWidth: 0 } },
            e('div', { style: { fontSize: 12, fontWeight: 600 } }, `${w.my_pts.toFixed(1)} – ${w.opp_pts?.toFixed(1) ?? '?'}`, e('span', { style: { fontSize: 10, color: 'var(--text3)', fontWeight: 400 } }, ` vs ${w.opp_name}`)),
            e('div', { className: 'bar-track', style: { height: 4, marginTop: 4 } }, e('div', { className: 'bar-fill', style: { width: `${w.efficiency}%`, background: ec } }))
          ),
          e('div', { style: { textAlign: 'right', minWidth: 70 } },
            e('div', { style: { fontSize: 11, fontWeight: 700, color: ec } }, `${w.efficiency}%`),
            e('div', { style: { fontSize: 9, color: w.left_on_bench > 0 ? 'var(--accent3)' : 'var(--text3)' } }, w.left_on_bench > 0 ? `${w.left_on_bench.toFixed(1)} on bench` : 'optimal')
          ),
          w.cost_the_game && e(Tag, { color: 'red' }, 'COST W')
        );
      })
    ),

    // ── schedule ──
    e(Section, { title: 'REMAINING SCHEDULE', right: data.schedule.length ? `${data.exp_remaining_wins} expected wins of ${data.schedule.length} · SOS ${data.schedule_strength} vs lg ${data.league_avg_strength}` : 'regular season over' },
      data.schedule.map(g => {
        const pc = g.win_prob >= 60 ? 'var(--accent)' : g.win_prob >= 40 ? 'var(--accent3)' : 'var(--accent2)';
        return e('div', { key: g.week, style: { display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', background: g.is_current ? 'rgba(92,158,255,0.06)' : 'var(--surface)', border: `1px solid ${g.is_current ? 'rgba(92,158,255,0.4)' : 'var(--border)'}`, borderRadius: 8, marginBottom: 4 } },
          e('div', { style: { minWidth: 34, fontSize: 10, color: 'var(--text3)' } }, `Wk ${g.week}`),
          e('div', { style: { flex: 1, minWidth: 0 } },
            e('div', { style: { fontSize: 12, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, g.opp_name, e('span', { style: { fontSize: 10, color: 'var(--text3)', fontWeight: 400 } }, ` (${g.opp_record})`)),
            e('div', { style: { fontSize: 10, color: 'var(--text3)' } }, `${g.my_proj} vs ${g.opp_proj} proj`)
          ),
          e('div', { style: { width: 80 } }, e('div', { className: 'bar-track', style: { height: 6 } }, e('div', { className: 'bar-fill', style: { width: `${g.win_prob}%`, background: pc } }))),
          e('div', { style: { minWidth: 34, textAlign: 'right', fontSize: 12, fontWeight: 700, color: pc } }, `${g.win_prob}%`)
        );
      })
    ),

    // ── trade assets + draft ──
    e('div', { className: 'grid-2' },
      e(Card, null,
        e('div', { style: { fontSize: 10, textTransform: 'uppercase', letterSpacing: 1, color: 'var(--accent2)', marginBottom: 6 } }, '💰 Sell Candidates (vets with value)'),
        data.sell_candidates.length ? data.sell_candidates.map(p => e(PlayerLine, { key: p.id, p })) : e('div', { style: { fontSize: 12, color: 'var(--text3)' } }, 'No high-value veterans to move.'),
        e('div', { style: { fontSize: 10, textTransform: 'uppercase', letterSpacing: 1, color: 'var(--accent)', margin: '12px 0 6px' } }, '🌱 Young Core (≤25, starter quality)'),
        data.young_core.length ? data.young_core.map(p => e(PlayerLine, { key: p.id, p })) : e('div', { style: { fontSize: 12, color: 'var(--text3)' } }, 'No young starter-quality players.'),
        e('div', { style: { display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 10 } },
          data.needs.map(n => e(Tag, { key: 'n' + n, color: 'red' }, `NEED ${n}`)),
          data.surplus.map(n => e(Tag, { key: 's' + n, color: 'blue' }, `SURPLUS ${n}`))
        )
      ),
      e(Card, null,
        e('div', { style: { fontSize: 10, textTransform: 'uppercase', letterSpacing: 1, color: 'var(--purple)', marginBottom: 6 } }, `📋 ${data.draft.season} Draft Capital`),
        e('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 6 } },
          data.draft.picks.map((p, i) => e('div', { key: i, style: { padding: '6px 10px', background: 'var(--surface2)', border: `1px solid ${p.own ? 'var(--border)' : 'rgba(92,158,255,0.4)'}`, borderRadius: 8, fontSize: 11 } },
            e('div', { style: { fontWeight: 700, color: 'var(--purple)' } }, `Rd ${p.round}`),
            !p.own && e('div', { style: { fontSize: 9, color: 'var(--accent4)' } }, `via ${p.original_owner}`)
          )),
          data.draft.traded_away.map((t, i) => e('div', { key: 'ta' + i, style: { padding: '6px 10px', background: 'rgba(255,92,92,0.06)', border: '1px solid rgba(255,92,92,0.3)', borderRadius: 8, fontSize: 11 } },
            e('div', { style: { fontWeight: 700, color: 'var(--accent2)', textDecoration: 'line-through' } }, `Rd ${t.round}`),
            e('div', { style: { fontSize: 9, color: 'var(--accent2)' } }, `to ${t.to}`)
          ))
        ),
        e('div', { style: { fontSize: 10, color: 'var(--text3)', marginTop: 8 } }, `${data.draft.picks.length} of ${data.draft.rounds} own-slot picks owned${data.draft.traded_away.length ? ` · ${data.draft.traded_away.length} traded away` : ''}`)
      )
    )
  );
}

// ── WEEK REVIEW VIEW ──────────────────────────────────────────────────────────
function WeekReviewView({ data }) {
  if (!data?.results?.length) return e(Alert, { type: 'info' }, e('p', null, 'No matchup data found for that week.'));
  const S = data.summary || {};
  const GRADE_COLOR = { A: 'var(--accent)', B: 'var(--accent4)', C: 'var(--accent3)', D: '#ff8c42', F: 'var(--accent2)' };
  const gradeChips = Object.entries(S.grades || {}).filter(([, n]) => n > 0);

  const DiffRow = ({ p }) => e('div', { className: 'player-row' },
    e(PosBadge, { pos: p.position }),
    e('span', { className: 'player-name' }, p.name),
    e('span', { className: 'player-team' }, p.team),
    e('span', { style: { fontSize: 10, color: 'var(--text3)' } }, `proj ${p.proj?.toFixed(1)}`),
    e('span', { className: 'player-pts', style: { color: p.diff < 0 ? 'var(--accent2)' : 'var(--accent)' } },
      `${p.pts?.toFixed(1)} (${p.diff > 0 ? '+' : ''}${p.diff})`)
  );

  return e('div', null,
    !data.week_done && e(Alert, { type: 'info' }, e('p', null, `Week ${data.week} isn't finished yet — this is a partial review.`)),
    e('div', { className: 'stat-row' },
      e(StatTile, { value: `${S.wins}-${S.losses}`, label: 'Week Record', color: 'var(--accent)' }),
      e(StatTile, { value: `${S.avg_efficiency}%`, label: 'Avg Efficiency', color: 'var(--accent4)' }),
      e(StatTile, { value: S.total_left_on_bench, label: 'Pts On Bench', color: 'var(--accent3)' }),
      e(StatTile, { value: S.cost_games, label: 'Lineup Cost A Win', color: S.cost_games ? 'var(--accent2)' : 'var(--text3)' })
    ),
    gradeChips.length > 0 && e('div', { style: { display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 16 } },
      gradeChips.map(([g, n]) => e('div', { key: g, style: { padding: '5px 12px', borderRadius: 20, border: `1px solid ${GRADE_COLOR[g]}`, color: GRADE_COLOR[g], fontSize: 12, fontWeight: 700 } }, `${g}: ${n}`))
    ),
    data.results.map(r => {
      const gc = GRADE_COLOR[r.grade];
      const resColor = r.won ? 'var(--accent)' : r.won === false ? 'var(--accent2)' : 'var(--text3)';
      return e(Card, { key: r.league, borderColor: gc },
        e('div', { className: 'card-header' },
          e('div', null,
            e('div', { className: 'card-title' }, r.league),
            e('div', { className: 'card-subtitle' }, `${r.team ? r.team + ' · ' : ''}vs ${r.opp_name}`)
          ),
          e('div', { style: { textAlign: 'right' } },
            e('div', { style: { fontFamily: 'Bebas Neue', fontSize: '1.8rem', color: gc, lineHeight: 1 } }, r.grade),
            e('div', { style: { fontSize: 12, fontWeight: 700, color: resColor } },
              `${r.won ? 'W' : r.won === false ? 'L' : '—'} ${r.my_pts?.toFixed(1)}–${r.opp_pts?.toFixed(1) ?? '?'}`)
          )
        ),
        r.cost_the_game && e(Alert, { type: 'error' }, e('p', null,
          `Your optimal lineup (${r.optimal_pts.toFixed(1)}) would have beaten ${r.opp_name} (${r.opp_pts.toFixed(1)}). This one was left on the bench.`)),
        e('div', { style: { marginBottom: 12 } },
          e('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: 11, marginBottom: 4 } },
            e('span', { style: { color: 'var(--text3)' } }, 'Lineup efficiency'),
            e('span', { style: { color: gc, fontWeight: 700 } }, `${r.efficiency}% · ${r.starter_pts.toFixed(1)} of ${r.optimal_pts.toFixed(1)} possible`)
          ),
          e('div', { className: 'bar-track', style: { height: 8 } }, e('div', { className: 'bar-fill', style: { width: `${r.efficiency}%`, background: gc } }))
        ),
        r.missed_moves?.length > 0
          ? e(MovesList, { moves: r.missed_moves, ptsKey: 'pts', title: `🪑 Left On Bench · ${r.left_on_bench.toFixed(1)} pts`,
                           verb: { start: 'SHOULD\'VE STARTED', move: 'SHOULD\'VE MOVED', bench: 'SHOULD\'VE SAT' } })
          : e('div', { style: { fontSize: 12, color: 'var(--accent)', marginBottom: 12 } }, '✅ You started your best possible lineup.'),
        r.underachievers?.length > 0 && e('div', { style: { marginBottom: 12 } },
          e('div', { style: { fontSize: 10, textTransform: 'uppercase', letterSpacing: 1, color: 'var(--accent2)', marginBottom: 6 } }, '📉 Underachievers'),
          r.underachievers.map(p => e(DiffRow, { key: p.id, p }))
        ),
        r.overachievers?.length > 0 && e('div', { style: { marginBottom: 12 } },
          e('div', { style: { fontSize: 10, textTransform: 'uppercase', letterSpacing: 1, color: 'var(--accent)', marginBottom: 6 } }, '📈 Overachievers'),
          r.overachievers.map(p => e(DiffRow, { key: p.id, p }))
        ),
        e('div', { style: { borderTop: '1px solid var(--border)', paddingTop: 12 } },
          e('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 } },
            e('div', { style: { fontSize: 10, textTransform: 'uppercase', letterSpacing: 1, color: 'var(--accent4)' } }, `➡️ Week ${r.next_week} Recommendations`),
            e('div', { style: { fontSize: 10, color: 'var(--text3)' } }, `current ${r.next_current_pts} → optimal ${r.next_optimal_pts}`)
          ),
          r.next_flags?.map(p => e('div', { key: p.id, style: { display: 'flex', alignItems: 'center', gap: 6, padding: '6px 10px', background: 'rgba(255,92,92,0.08)', border: '1px solid rgba(255,92,92,0.3)', borderRadius: 6, marginBottom: 4, fontSize: 12 } },
            e(PosBadge, { pos: p.position }), e('span', { style: { flex: 1 } }, p.name),
            e(Tag, { color: 'red' }, p.on_bye ? 'ON BYE' : (p.injury_status || '').toUpperCase())
          )),
          r.still_starting_under?.map(p => e('div', { key: 'u' + p.id, style: { display: 'flex', alignItems: 'center', gap: 6, padding: '6px 10px', background: 'rgba(255,179,71,0.06)', border: '1px solid rgba(255,179,71,0.3)', borderRadius: 6, marginBottom: 4, fontSize: 12 } },
            e(PosBadge, { pos: p.position }), e('span', { style: { flex: 1 } }, p.name),
            e(Tag, { color: 'orange' }, 'UNDERPERFORMED · STILL STARTING')
          )),
          r.next_moves?.length > 0
            ? e(MovesList, { moves: r.next_moves, ptsKey: 'pts' })
            : e('div', { style: { fontSize: 12, color: 'var(--accent)' } }, '✅ Lineup already optimal for next week.')
        )
      );
    })
  );
}

// ── WEEK ANALYSIS VIEW ────────────────────────────────────────────────────────
function WeekAnalysisView({ data }) {
  if (!data?.results?.length) return e(Alert, { type: 'info' }, e('p', null, 'No matchup data found.'));
  const wins = data.results.filter(r => r.won).length;
  const losses = data.results.filter(r => !r.won && !r.tied).length;
  const ties = data.results.filter(r => r.tied).length;

  return e('div', null,
    e('div', { className: 'stat-row' },
      e(StatTile, { value: `${wins}-${losses}${ties ? `-${ties}` : ''}`, label: 'Record', color: 'var(--accent)' }),
      e(StatTile, { value: data.results.reduce((s,r) => s + (r.my_pts||0), 0).toFixed(1), label: 'Total Pts', color: 'var(--accent4)' }),
      e(StatTile, { value: data.results.filter(r => (r.optimal_gain||0) > 2).length, label: 'Lineup Issues', color: 'var(--accent3)' })
    ),
    data.results.map(r => {
      const winColor = r.won ? 'var(--accent)' : r.tied ? 'var(--accent3)' : 'var(--accent2)';
      return e(Card, { key: r.league, borderColor: winColor },
        e('div', { className: 'card-header' },
          e('div', null,
            e('div', { className: 'card-title' }, r.league),
            e('div', { className: 'card-subtitle' }, `${r.team ? r.team + ' · ' : ''}vs ${r.opp_name}`)
          ),
          e('div', { style: { textAlign: 'right' } },
            e('div', { style: { fontFamily: 'Bebas Neue', fontSize: '1.6rem', color: winColor } },
              `${r.my_pts?.toFixed(2)} – ${r.opp_pts?.toFixed(2)}`
            ),
            e('div', { style: { fontSize: 11, color: winColor, fontWeight: 700 } }, r.won ? '✅ WIN' : r.tied ? '🤝 TIE' : '❌ LOSS'),
            r.optimal_gain > 2 && e('div', { style: { fontSize: 10, color: 'var(--accent3)' } }, `+${r.optimal_gain?.toFixed(1)} left on bench`)
          )
        ),
        r.my_starters?.length > 0 && e('div', null,
          e('div', { style: { fontSize: 10, textTransform: 'uppercase', letterSpacing: 1, color: 'var(--text3)', marginBottom: 6 } }, 'Your Starters'),
          r.my_starters.map(p => {
            const ptColor = p.pts >= 20 ? 'var(--accent)' : p.pts >= 10 ? 'var(--text2)' : 'var(--accent2)';
            return e('div', { key: p.id, className: 'player-row' },
              e(PosBadge, { pos: p.position }),
              e('span', { className: 'player-name' }, p.name),
              e('span', { className: 'player-team' }, p.team),
              e('span', { className: 'player-pts', style: { color: ptColor } }, p.pts?.toFixed(2))
            );
          })
        )
      );
    })
  );
}

// ── UPGRADE RECS VIEW ─────────────────────────────────────────────────────────
function UpgradeRecsView({ data }) {
  if (!data?.results?.length) return e(Alert, { type: 'info' }, e('p', null, 'No data found.'));
  const hasUpgrades = data.results.filter(r => r.moves?.length > 0);
  const optimal = data.results.filter(r => !r.moves?.length);

  return e('div', null,
    e('div', { className: 'stat-row' },
      e(StatTile, { value: hasUpgrades.length, label: 'Need Changes', color: 'var(--accent3)' }),
      e(StatTile, { value: optimal.length, label: 'Optimal', color: 'var(--accent)' })
    ),
    hasUpgrades.map(r => e(Card, { key: r.league, borderColor: 'var(--accent3)' },
      e('div', { className: 'card-header' },
        e('div', null, e('div', { className: 'card-title' }, r.league), r.team && e('div', { className: 'card-subtitle' }, r.team)),
        e('div', { style: { textAlign: 'right' } },
          e('div', { style: { fontFamily: 'Bebas Neue', fontSize: '1.4rem', color: 'var(--accent3)' } }, `+${r.gain?.toFixed(1)}`),
          e('div', { style: { fontSize: 10, color: 'var(--text3)' } }, 'pts gain')
        )
      ),
      e(MovesList, { moves: r.moves, ptsKey: 'week_pts', subKey: 'ytd_avg' }),

// ── SEASON RECORDS VIEW ───────────────────────────────────────────────────────
function SeasonRecordsView({ data }) {
  if (!data?.results?.length) return e(Alert, { type: 'info' }, e('p', null, 'No leagues found.'));
  const sm = data.summary || {};
  const [sortKey, setSortKey] = useState('league');
  const [desc, setDesc] = useState(false);
  const cols = [
    ['league', 'League', 'left'], ['record', 'Rec', 'right'], ['pf', 'PF', 'right'], ['pa', 'PA', 'right'], ['max_pf', 'Max PF', 'right'], ['efficiency', 'Eff%', 'right'],
  ];
  const rows = [...data.results];
  if (sortKey !== 'league') {
    const k = sortKey === 'record' ? 'win_pct' : sortKey;
    rows.sort((a, b) => ((b[k] ?? -1) - (a[k] ?? -1)) * (desc ? -1 : 1) || a.league.localeCompare(b.league));
  } else if (desc) rows.reverse();
  const click = k => { if (sortKey === k) setDesc(!desc); else { setSortKey(k); setDesc(false); } };
  const effColor = v => v == null ? 'var(--text3)' : v >= 90 ? 'var(--accent)' : v >= 80 ? 'var(--accent3)' : 'var(--accent2)';
  const recColor = p => p > 0.5 ? 'var(--accent)' : p < 0.5 ? 'var(--accent2)' : 'var(--text2)';

    e('div', { style: { fontFamily: 'Bebas Neue', letterSpacing: 2, color: 'var(--text2)', marginBottom: 8 } }, `${data.season} SEASON RECORDS · THROUGH WEEK ${Math.max((data.week || 1) - 1, 0)}`),

      sm.worst_eff ? e('span', null, ` Lowest efficiency: `, e('b', null, sm.worst_eff), '.') : null),
    e('div', { style: { overflowX: 'auto', WebkitOverflowScrolling: 'touch' } },
      e('table', { style: { width: '100%', borderCollapse: 'collapse' } },
        e('thead', null, e('tr', null, cols.map(th))),
        e('tbody', null, rows.map(r => e('tr', { key: r.league },
          td(e('div', null, e('div', { style: { fontWeight: 700, maxWidth: 160, overflow: 'hidden', textOverflow: 'ellipsis' } }, r.league), e('div', { style: { fontSize: 10, color: 'var(--text3)', maxWidth: 160, overflow: 'hidden', textOverflow: 'ellipsis' } }, `${r.team}${r.rank ? ` · #${r.rank}/${r.total_teams}` : ''}`)), 'left', { whiteSpace: 'normal' }),
          td(r.record, 'right', { fontWeight: 700, color: recColor(r.win_pct) }),

// ── SEASON FORECAST VIEW ──────────────────────────────────────────────────────
function SeasonForecastView({ data }) {
  if (!data?.results?.length) return e(Alert, { type: 'info' }, e('p', null, 'No data found.'));
  return e('div', null,
    e('div', { style: { fontFamily: 'Bebas Neue', letterSpacing: 2, color: 'var(--text2)', marginBottom: 12 } }, 'PROJECTED FINAL RECORDS'),
    data.results.map(r => {
      const projWinPct = r.proj_wins / Math.max(r.proj_wins + r.proj_losses, 1);
      const barColor = projWinPct >= 0.6 ? 'var(--accent)' : projWinPct >= 0.45 ? 'var(--accent3)' : 'var(--accent2)';
      return e('div', { key: r.league, style: { marginBottom: 12, padding: '12px 14px', background: 'var(--surface)', border: '1px solid var(--border)', borderLeft: `3px solid ${barColor}`, borderRadius: 10 } },
        e('div', { style: { display: 'flex', justifyContent: 'space-between', marginBottom: 6 } },
          e('div', null,
            e('div', { style: { fontWeight: 700, fontSize: 14 } }, r.league),
            e('div', { style: { fontSize: 11, color: 'var(--text2)', marginTop: 2 } }, `${r.team ? r.team + ' · ' : ''}Current: ${r.current_record}`)
          ),
          e('div', { style: { textAlign: 'right' } },
            e('div', { style: { fontFamily: 'Bebas Neue', fontSize: '1.4rem', color: barColor } }, r.projected_record),
            e('div', { style: { fontSize: 10, color: 'var(--text3)' } }, 'projected final')
          )
        ),
        e('div', { className: 'bar-track', style: { height: 8 } },
          e('div', { className: 'bar-fill', style: { width: `${projWinPct * 100}%`, background: barColor } })
        ),
        e('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--text3)', marginTop: 4 } },
          e('span', null, `${r.weeks_remaining} weeks remaining`),
          e('span', null, `${r.my_proj_score} proj pts/wk`)
        )
      );
    })
  );
}

// ── DRAFT PICKS VIEW ──────────────────────────────────────────────────────────
function DraftPicksView({ data }) {

  const total = data.results.reduce((s, r) => s + (r.upcoming_picks?.length || 0), 0);
  return e('div', null,
    e('div', { className: 'stat-row' },
      e(StatTile, { value: total, label: 'Total Picks', color: 'var(--accent4)' }),
      e(StatTile, { value: data.results.filter(r => r.upcoming_picks?.length).length, label: 'Leagues', color: 'var(--text2)' })
    ),
    data.results.map(r => e(Card, { key: r.league },
      e('div', { className: 'card-title' }, r.league),

}

// ── DRAFT DATES VIEW ──────────────────────────────────────────────────────────
function DraftDatesView({ data }) {
  if (!data?.results?.length) return e(Alert, { type: 'info' }, e('p', null, 'No draft data found.'));
  const STATUS_COLOR = { drafting: 'var(--accent2)', paused: 'var(--accent3)', pre_draft: 'var(--accent4)', complete: 'var(--text3)' };
  const STATUS_LABEL = { drafting: '🔴 In Progress', paused: '⏸ Paused', pre_draft: '📅 Scheduled', complete: '✅ Complete' };
  const grouped = {};
  data.results.forEach(r => {
    const s = r.status || 'unknown';
    if (!grouped[s]) grouped[s] = [];
    grouped[s].push(r);
  });
  const statusOrder = ['drafting', 'paused', 'pre_draft', 'complete'];

  return e('div', null,
    statusOrder.filter(s => grouped[s]).map(status =>
      e('div', { key: status, style: { marginBottom: 16 } },
        e('div', { style: { fontFamily: 'Bebas Neue', letterSpacing: 2, color: STATUS_COLOR[status] || 'var(--text3)', marginBottom: 8 } }, STATUS_LABEL[status] || status.toUpperCase()),
        grouped[status].map(r => e('div', { key: r.draft_id, style: { padding: '10px 14px', background: 'var(--surface)', border: `1px solid ${STATUS_COLOR[status] || 'var(--border)'}`, borderRadius: 10, marginBottom: 6 } },
          e('div', { style: { fontWeight: 700, fontSize: 13 } }, r.league),
          e('div', { style: { fontSize: 11, color: 'var(--text3)', marginTop: 3 } },
            r.type ? `${r.type} · ` : '',
            r.start_time ? new Date(r.start_time).toLocaleString() : 'Date TBD'
          )
        ))
      )
    )
  );
}

        e('div', { style: { fontSize: 10, textTransform: 'uppercase', letterSpacing: 1, color: 'var(--accent)', marginBottom: 5 } }, 'Your Next Picks'),

// ── APP ───────────────────────────────────────────────────────────────────────
// ── MOBILE ACCORDION NAV ─────────────────────────────────────────────────────
function MobileAccordion({ sections, active, onRun }) {
  const [openSections, setOpenSections] = useState(() => {
    // Start with the section containing the active feature open, or first section
    const initial = new Set();
    initial.add(sections[0]?.label);
    return initial;
  });

  const toggle = (label) => {
    setOpenSections(prev => {
      const next = new Set(prev);
      if (next.has(label)) next.delete(label);
      else next.add(label);
      return next;
    });
  };

  return e('div', { className: 'mobile-accordion' },
    sections.map(section =>
      e('div', { key: section.label, className: 'accordion' },
        e('button', {
          className: 'accordion-header',
          onClick: () => toggle(section.label),
        },
          e('span', null, section.label),
          e('span', { className: `accordion-chevron${openSections.has(section.label) ? ' open' : ''}` }, '▼')
        ),
        openSections.has(section.label) && e('div', { className: 'accordion-body' },
          section.features.map(f =>
            e('button', {
              key: f.id,
              className: `accordion-btn${active === f.id ? ' active' : ''}`,
              onClick: () => onRun(f),
            }, f.label)
          )
        )
      )
    )
  );
}

function App() {
  const [username, setUsername] = useState('');
  const [leagueName, setLeagueName] = useState('');
  const [week, setWeek] = useState('');
  const [active, setActive] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadingMsg, setLoadingMsg] = useState('');
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);

  const run = useCallback(async (feature) => {
    if (!username) { setError('Please enter a username'); return; }
    if (feature.needsWeek && !week) { setError('Please enter a week number'); return; }
    if (feature.needsLeague && !leagueName) { setError('Enter the League Name (exact or partial) for a deep dive'); return; }
    setActive(feature.id);
    setLoading(true);
    setError(null);
    setResult(null);
    setLoadingMsg(`Running ${feature.label}…`);
    try {
      const body = { username };
      if (week) body.week = parseInt(week);
      if (leagueName) body.league_name = leagueName;
      const data = await API.post(feature.endpoint, body);
      setResult({ feature, data });
    } catch(err) {
      setError(err.message);
    } finally {
      setLoading(false);
    }
  }, [username, week, leagueName]);

  const renderResult = () => {
    if (!result) return e('div', { className: 'empty' }, 'Select a feature from the sidebar to get started.');
    const { feature, data } = result;
    switch(feature.id) {
      case 'injured': case 'questionable': case 'bye': case 'open': case 'zero-proj':
        return e(AlertsView, { data, type: feature.id });
      case 'week-record': case 'week-record-pred':
        return e(WeekRecordView, { data });
      case 'theres-a-chance':
        return e(ThereIsAChanceView, { data });
      case 'optimal':
        return e(OptimalLineupView, { data });
      case 'overview':
        return e(OverviewView, { data });
      case 'tier-records':
        return e(TierRecordsView, { data });
      case 'deep-dive':
        return e(DeepDiveView, { data });
      case 'position-needs':
        return e(PositionNeedsView, { data });
      case 'week-analysis':
        return e(WeekAnalysisView, { data });
      case 'week-review':
        return e(WeekReviewView, { data });
      case 'upgrade':
        return e(UpgradeRecsView, { data });
      case 'season-forecast':
        return e(SeasonForecastView, { data });
      case 'draft-picks':
        return e(DraftPicksView, { data });
      case 'draft-dates':
        return e(DraftDatesView, { data });
      case 'live-draft':
        return e(LiveDraftView, { data });
      case 'starter-upgrades':
        return e(StarterUpgradesView, { data });
      case 'bench-vs-fa':
        return e(BenchVsFaView, { data });
      case 'waiver-watch':
        return e(WaiverWatchView, { data });
      case 'playoff-odds':
        return e(PlayoffOddsView, { data });
      case 'weekly-digest':
        return e(WeeklyDigestView, { data });
      case 'rooting-guide':
        return e(RootingGuideView, { data });
      case 'season-records':
        return e(SeasonRecordsView, { data });
      case 'ir-eligible':
        return e(IrEligibleView, { data });
      default:
        return e(GenericView, { data, title: feature.label });
    }
  };

  const allFeatures = SECTIONS.flatMap(s => s.features);

  return e('div', { id: 'root' },
    // Header
    e('div', { className: 'app-header' },
      e('div', { style: { display: 'flex', alignItems: 'baseline' } },
        e('span', { className: 'app-title' }, '🏈 Fantasy Manager'),
        e('span', { className: 'app-version' }, 'v10.18')
      ),
      e('div', { style: { fontSize: 12, color: 'var(--text3)' } }, username || '—')
    ),

    // Config
    e('div', { className: 'config-panel' },
      e('div', { className: 'config-field' },
        e('label', null, 'Username'),
        e('input', { value: username, onChange: ev => setUsername(ev.target.value), placeholder: 'sleeper username' })
      ),
      e('div', { className: 'config-field' },
        e('label', null, 'Week (opt)'),
        e('input', { className: 'short', value: week, onChange: ev => setWeek(ev.target.value), placeholder: '1–18', type: 'number', min: 1, max: 18 })
      ),
      e('div', { className: 'config-field' },
        e('label', null, 'League Name (deep dive)'),
        e('input', { value: leagueName, onChange: ev => setLeagueName(ev.target.value), placeholder: 'exact league name' })
      )
    ),

    // Mobile accordion nav
    e(MobileAccordion, { sections: SECTIONS, active, onRun: run }),

    // Body
    e('div', { className: 'app-body' },
      // Sidebar
      e('div', { className: 'sidebar' },
        SECTIONS.map(section => e('div', { key: section.label },
          e('div', { className: 'section-label' }, section.label),
          section.features.map(f => e('button', { key: f.id, className: `btn ${active === f.id ? 'btn-green' : 'btn-blue'}`, onClick: () => run(f) }, f.label))
        ))
      ),

      // Main
      e('div', { className: 'main-content' },
        loading ? e(Loading, { message: loadingMsg })
        : error ? e(Alert, { type: 'error', title: 'Error' }, e('p', null, error))
        : e('div', null,
            result && e(Alert, { type: 'success', title: result.feature.label },
              e('p', null, `Loaded for ${username}`)
            ),
            renderResult()
          )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
